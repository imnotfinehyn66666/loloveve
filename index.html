<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Countdown · Split Screen</title>
<meta name="theme-color" content="#05060a">
<style>
  :root {
    --dark: #05060b;
    --dark-2: #0d1020;
    --light: #f3f4f8;
    --light-2: #e4e7f1;
    --blue: #3f6bff;
    --violet: #8a5bff;
    --cyan: #34d6ff;
    --ink: #0a0b12;
    --paper: #ffffff;
    --font: "Samsung Sharp Sans", "SamsungOne", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
    --seam: 50%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--dark);
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ───────── Stage: two halves ───────── */
  .stage {
    position: relative;
    height: 100svh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .half {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(1rem, 3.5vh, 3rem);
    padding: clamp(1.5rem, 4vw, 4.5rem);
    overflow: hidden;
    isolation: isolate;
  }
  .half.left {
    background: var(--dark);
    color: #fff;
    align-items: flex-start;
    animation: slideL 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  .half.right {
    background: var(--light);
    color: var(--ink);
    align-items: flex-end;
    text-align: right;
    animation: slideR 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes slideL { from { transform: translateX(-12%); opacity: 0; } }
  @keyframes slideR { from { transform: translateX(12%);  opacity: 0; } }

  /* ambient light */
  .half::before {
    content: ""; position: absolute; inset: -20%; z-index: -1;
    filter: blur(60px);
    animation: drift 14s ease-in-out infinite alternate;
  }
  .left::before {
    background:
      radial-gradient(40% 35% at 25% 30%, rgba(63,107,255,.55), transparent 70%),
      radial-gradient(35% 30% at 80% 80%, rgba(138,91,255,.40), transparent 70%);
  }
  .right::before {
    background:
      radial-gradient(40% 35% at 75% 25%, rgba(52,214,255,.45), transparent 70%),
      radial-gradient(35% 30% at 20% 85%, rgba(255,166,230,.45), transparent 70%);
    animation-direction: alternate-reverse;
  }
  @keyframes drift { to { transform: translate3d(6%, -4%, 0) scale(1.08); } }

  /* ───────── Header copy ───────── */
  .eyebrow {
    font-size: clamp(.7rem, 1vw, .85rem);
    letter-spacing: .38em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: .7;
    display: flex; align-items: center; gap: .8em;
  }
  .right .eyebrow { flex-direction: row-reverse; }
  .eyebrow i {
    width: .6em; height: .6em; border-radius: 50%;
    background: #ff3b57; box-shadow: 0 0 0 0 rgba(255,59,87,.7);
    animation: live 1.6s infinite;
  }
  @keyframes live { 70% { box-shadow: 0 0 0 .9em rgba(255,59,87,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,87,0); } }

  .title {
    font-weight: 800;
    letter-spacing: -.04em;
    line-height: .95;
    font-size: clamp(2rem, min(4.2vw, 7vh), 4.2rem);
  }
  .title small {
    display: block; margin-top: .6em;
    font-size: clamp(.8rem, 1.1vw, 1rem);
    letter-spacing: 0; font-weight: 400; opacity: .6; line-height: 1.5;
  }
  .grad {
    background: linear-gradient(100deg, var(--cyan), var(--blue) 45%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ───────── Number blocks ───────── */
  .unit { display: flex; flex-direction: column; gap: .2em; }
  .right .unit { align-items: flex-end; }
  .num {
    display: flex;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.06em;
    line-height: .88;
    font-size: clamp(4rem, min(11vw, 19vh), 13rem);
  }
  .digit {
    position: relative; display: inline-block;
    width: .64em; height: .98em; overflow: hidden;
    text-align: center;
  }
  .digit span { position: absolute; inset: 0; display: block; will-change: transform; }
  .left .num  { background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,.35)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .right .num { background: linear-gradient(180deg, #0a0b12 35%, rgba(10,11,18,.35)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .digit span { -webkit-background-clip: text; background-clip: text; }

  .label {
    font-size: clamp(.7rem, 1vw, .9rem);
    letter-spacing: .32em; text-transform: uppercase; font-weight: 600; opacity: .55;
  }
  .label b { font-weight: 500; opacity: .7; margin-left: .8em; letter-spacing: .1em; }
  .right .label b { margin: 0 .8em 0 0; }

  .foot { font-size: .75rem; opacity: .45; letter-spacing: .02em; max-width: 24em; }

  /* ───────── Seam ───────── */
  .seam {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; transform: translateX(-1px);
    background: linear-gradient(180deg, transparent, var(--cyan) 20%, var(--violet) 80%, transparent);
    box-shadow: 0 0 24px 2px rgba(120,120,255,.7);
    z-index: 5;
    animation: seam 1.1s .2s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes seam { from { transform: translateX(-1px) scaleY(0); } }

  /* ───────── Phone (straddles the seam) ───────── */
  .phone {
    --w: clamp(190px, 19vw, 300px);
    position: absolute; z-index: 10;
    top: 50%; left: 50%;
    width: var(--w); aspect-ratio: 9 / 19.3;
    transform: translate(-50%, -50%) rotate(-6deg);
    border-radius: calc(var(--w) * .16);
    padding: calc(var(--w) * .028);
    background: linear-gradient(145deg, #e9ecf5 0%, #8c92a6 22%, #2b2e3a 48%, #9aa0b5 75%, #f1f3fa 100%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.15) inset,
      0 60px 120px -20px rgba(0,0,0,.65),
      0 30px 60px -10px rgba(63,107,255,.35);
    animation: phoneIn 1.3s .35s cubic-bezier(.2,.9,.2,1) both, float 6s 1.7s ease-in-out infinite;
  }
  @keyframes phoneIn { from { transform: translate(-50%, -30%) rotate(-18deg) scale(.7); opacity: 0; } }
  @keyframes float   { 50% { transform: translate(-50%, -52%) rotate(-4deg); } }

  .phone::before, .phone::after { /* side keys */
    content: ""; position: absolute; right: -3px; width: 3px; border-radius: 2px;
    background: linear-gradient(#cfd3e2, #6c7186);
  }
  .phone::before { top: 22%; height: 8%; }
  .phone::after  { top: 34%; height: 14%; }

  .screen {
    position: relative; height: 100%;
    border-radius: calc(var(--w) * .135);
    overflow: hidden;
    background: #000;
    display: grid; grid-template-columns: 1fr 1fr;
  }
  /* the screen repeats the split: dark | light, with a clock sitting across it */
  .screen .sl { background: linear-gradient(160deg, #0b1030, #1b1457); }
  .screen .sr { background: linear-gradient(200deg, #f4f6ff, #cfd8ff); }
  .screen::after { /* glass sheen */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.22) 0%, transparent 32%);
  }
  .cam {
    position: absolute; top: 2.4%; left: 50%; transform: translateX(-50%);
    width: 3.6%; aspect-ratio: 1; border-radius: 50%; z-index: 4;
    background: radial-gradient(circle at 35% 35%, #3a4aa8, #05060b 60%);
    box-shadow: 0 0 0 2px #000;
  }
  .ui {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6%;
  }
  .ring { width: 74%; aspect-ratio: 1; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring .bg { stroke: rgba(128,128,160,.35); }
  .ring .fg { stroke: url(#g); transition: stroke-dashoffset .95s linear; }
  .ring .core {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: #fff; text-shadow: 0 2px 14px rgba(10,16,60,.55);
  }
  .core strong { display: block; font-size: calc(var(--w) * .22); font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1; }
  .core span { font-size: calc(var(--w) * .045); letter-spacing: .3em; opacity: .8; }
  .clock {
    font-size: calc(var(--w) * .085); font-weight: 700; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 2px 12px rgba(10,16,60,.6);
  }
  .bar {
    position: absolute; bottom: 2.2%; left: 50%; transform: translateX(-50%);
    width: 32%; height: 1.1%; border-radius: 9px; background: #fff; mix-blend-mode: difference; opacity: .7; z-index: 4;
  }

  /* ───────── Reached zero ───────── */
  .done .num { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { filter: brightness(1.4) drop-shadow(0 0 30px rgba(120,140,255,.8)); } }

  /* ───────── Mobile: split top / bottom ───────── */
  @media (max-width: 760px) {
    body { overflow: auto; }
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; min-height: 100svh; height: auto; }
    .half { padding: 1.4rem 1.4rem; gap: 1rem; min-height: 50svh; }
    .half.left, .half.right { align-items: flex-start; text-align: left; }
    .right .unit { align-items: flex-start; }
    .right .eyebrow { flex-direction: row; }
    .right .label b { margin: 0 0 0 .8em; }
    .num { font-size: clamp(4rem, 24vw, 7rem); }
    .seam { top: 50%; bottom: auto; left: 0; right: 0; width: auto; height: 2px; transform: translateY(-1px);
            background: linear-gradient(90deg, transparent, var(--cyan) 20%, var(--violet) 80%, transparent); animation: none; }
    .phone { display: none; }
    .eyebrow { letter-spacing: .2em; }
    .foot { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <section class="half left">
    <div class="eyebrow"><i></i><span id="eyebrow">Live Countdown</span></div>
    <h1 class="title"><span id="t1">The next</span><br><span class="grad" id="t2">Epic</span><br><span id="t3">is coming.</span>
      <small id="sub">곧, 새로운 경험이 펼쳐집니다.</small>
    </h1>
    <div class="unit" data-unit="days">
      <div class="num"><span class="digit"></span><span class="digit"></span></div>
      <div class="label">Days<b>일</b></div>
    </div>
    <div class="unit" data-unit="hours">
      <div class="num"><span class="digit"></span><span class="digit"></span></div>
      <div class="label">Hours<b>시간</b></div>
    </div>
  </section>

  <section class="half right">
    <div class="eyebrow"><i></i><span id="when">—</span></div>
    <div class="unit" data-unit="minutes">
      <div class="num"><span class="digit"></span><span class="digit"></span></div>
      <div class="label">Minutes<b>분</b></div>
    </div>
    <div class="unit" data-unit="seconds">
      <div class="num"><span class="digit"></span><span class="digit"></span></div>
      <div class="label">Seconds<b>초</b></div>
    </div>
    <div class="foot">날짜 변경: 주소 끝에 <code>?date=2027-01-22T10:00:00%2B09:00</code></div>
  </section>

  <div class="seam"></div>

  <!-- phone sits on the seam -->
  <div class="phone" aria-hidden="true">
    <div class="screen">
      <div class="sl"></div><div class="sr"></div>
      <div class="cam"></div>
      <div class="ui">
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#34d6ff"/><stop offset=".5" stop-color="#3f6bff"/><stop offset="1" stop-color="#8a5bff"/>
            </linearGradient></defs>
            <circle class="bg" cx="50" cy="50" r="44"/>
            <circle class="fg" id="ringfg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/>
          </svg>
          <div class="core"><div><strong id="pd">00</strong><span>DAYS LEFT</span></div></div>
        </div>
        <div class="clock" id="pclock">00:00:00</div>
      </div>
      <div class="bar"></div>
    </div>
  </div>
</main>

<script>
(() => {
  // ── 설정: URL 파라미터로 덮어쓸 수 있음 (?date=...&title=...) ──
  const q = new URLSearchParams(location.search);
  const DEFAULT_DATE = "2027-01-22T10:00:00+09:00";
  let target = new Date(q.get("date") || DEFAULT_DATE);
  if (isNaN(target)) target = new Date(DEFAULT_DATE);
  const title = q.get("title");
  if (title) document.getElementById("t2").textContent = title;

  document.getElementById("when").textContent =
    target.toLocaleString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const units = {};
  document.querySelectorAll("[data-unit]").forEach(u => {
    units[u.dataset.unit] = [...u.querySelectorAll(".digit")];
  });
  const start = Date.now();

  function setDigit(el, val, animate) {
    const cur = el.firstElementChild;
    if (cur && cur.textContent === val) return;
    const next = document.createElement("span");
    next.textContent = val;
    el.appendChild(next);
    if (cur && animate && !reduce) {
      const o = { duration: 520, easing: "cubic-bezier(.2,.9,.2,1)", fill: "both" };
      cur.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-100%)", opacity: 0 }], o)
         .onfinish = () => cur.remove();
      next.animate([{ transform: "translateY(100%)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], o);
    } else if (cur) cur.remove();
  }
  function setNum(name, n, animate, pad = 2) {
    const s = String(n).padStart(pad, "0").slice(-pad);
    units[name].forEach((el, i) => setDigit(el, s[i], animate));
  }

  const ringfg = document.getElementById("ringfg");
  const C = 2 * Math.PI * 44;
  const pad = n => String(n).padStart(2, "0");

  function tick() {
    const now = Date.now();
    const first = now - start < 50;
    let diff = Math.max(0, Math.ceil((target - now) / 1000));
    const d = Math.floor(diff / 86400);
    const h = Math.floor(diff % 86400 / 3600);
    const m = Math.floor(diff % 3600 / 60);
    const s = diff % 60;

    setNum("days", Math.min(d, 99), !first);
    setNum("hours", h, !first);
    setNum("minutes", m, !first);
    setNum("seconds", s, !first);

    document.getElementById("pd").textContent = pad(Math.min(d, 99));
    document.getElementById("pclock").textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    ringfg.style.strokeDashoffset = (C * (1 - (s === 0 ? 1 : s / 60))).toFixed(2);

    document.getElementById("stage").classList.toggle("done", diff === 0);
    if (diff === 0) {
      document.getElementById("sub").textContent = "지금 시작합니다.";
      document.getElementById("eyebrow").textContent = "Now Live";
    }
  }
  tick();
  // 초 경계에 맞춰 갱신해 표시가 어긋나지 않게 함
  (function loop() { tick(); setTimeout(loop, 1000 - (Date.now() % 1000) + 5); })();
})();
</script>
</body>
</html>
